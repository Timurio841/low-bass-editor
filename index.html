<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/wavesurfer.js@7"></script>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #141414; color: white; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

.header { display: flex; justify-content: space-between; padding: 8px 10px; background: #1a1a1a; align-items: center; gap: 8px; font-size: 13px; }
.time { color: #4a9eff; font-weight: bold; font-size: 13px; }

.moments-panel { display: flex; gap: 6px; padding: 8px; background: #0f0f0f; overflow-x: auto; min-height: 62px; align-items: center; }
.moment-chip-wrap { position: relative; flex-shrink: 0; }
.moment-chip { min-width: 74px; padding: 8px 10px; background: #9b59b6; border-radius: 8px; font-size: 11px; font-weight: bold; display: flex; flex-direction: column; gap: 2px; user-select: none; touch-action: none; cursor: grab; }
.moment-chip:active { cursor: grabbing; }
.moment-chip .sub { font-size: 10px; opacity: 0.75; font-weight: normal; }
.moment-del { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; background: #ff4444; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #fff; cursor: pointer; z-index: 2; }

.editor-container { flex-grow: 1; position: relative; overflow-x: auto; overflow-y: hidden; background: #0d0d0d; touch-action: pan-x; }
#waveform { position: absolute; top: 30px; left: 0; height: 130px; }
#notes-canvas { position: absolute; top: 0; left: 0; z-index: 10; touch-action: none; }
#playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: #ff4444; z-index: 15; display: none; pointer-events: none; box-shadow: 0 0 5px #ff4444; }

.controls { background: #1a1a1a; padding: 8px; display: flex; flex-direction: column; gap: 4px; z-index: 20; }
.slider-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #aaa; }
.slider-row input { width: 50%; accent-color: #3a8eef; }
.val { width: 55px; text-align: right; color: #fff; font-weight: bold; }

.actions { display: flex; gap: 4px; padding: 6px 8px; background: #141414; z-index: 20; }
.btn { flex: 1; min-width: 60px; padding: 10px 4px; border: none; border-radius: 8px; font-weight: bold; font-size: 12px; color: white; transition: box-shadow 0.15s; }
.btn-green { background: #7ad07a; color: black; }
.btn-gray { background: #333; }
.btn-blue { background: #3a8eef; }
.btn-orange { background: #ffaa00; color: black; }
.btn-purple { background: #9b59b6; }
.btn-red { background: #ff4444; }
.btn-active { box-shadow: 0 0 0 2px #fff inset; }

.hint { padding: 5px 10px; background: #2a2a2a; color: #ffaa00; font-size: 11px; text-align: center; min-height: 22px; }
</style>
</head>
<body>
<div class="header">
    <span>🎛 Low Bass</span>
    <span class="time" id="timer">0:00 / 0:00</span>
</div>

<div class="moments-panel" id="moments-panel"></div>

<div class="hint" id="hint">Выделите ноты → 💾 Момент. Затем перетащите момент в промежуток.</div>

<div class="editor-container" id="editor-container">
    <div id="waveform"></div>
    <canvas id="notes-canvas"></canvas>
    <div id="playhead"></div>
</div>

<div class="controls">
    <div class="slider-row">
        <span>Инстр</span>
        <input type="range" id="vol-inst" min="0" max="200" value="100">
        <span class="val" id="val-inst">100%</span>
    </div>
    <div class="slider-row">
        <span>Бас</span>
        <input type="range" id="vol-bass" min="-10" max="10" value="0">
        <span class="val" id="val-bass">0 dB</span>
    </div>
</div>

<div class="actions">
    <button class="btn btn-gray" onclick="tg.close()">✕</button>
    <button class="btn btn-blue" onclick="togglePlay()" id="play-btn">▶</button>
    <button class="btn btn-green" onclick="save()">✓ Готово</button>
</div>

<div class="actions">
    <button class="btn btn-gray" onclick="startGapSelection()" id="btn-gap">📍 Промежуток</button>
    <button class="btn btn-purple" onclick="saveAsMoment()" id="btn-moment">💾 Момент</button>
    <button class="btn btn-red" onclick="cancelMode()" id="btn-cancel">✕ Отмена</button>
</div>

<div class="actions">
    <button class="btn btn-orange" onclick="moveEdge(-1)" title="Сдвинуть границу влево">←</button>
    <button class="btn btn-orange" onclick="moveEdge(1)" title="Сдвинуть границу вправо">→</button>
    <button class="btn btn-gray" onclick="splitNote()">✂</button>
    <button class="btn btn-gray" onclick="joinNotes()">🔗</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const SUPABASE_URL = "https://nizngtkkmqqyhuyqhold.supabase.co";
const SUPABASE_KEY = "sb_publishable_ryrnxleq02WsQ7fcqPL3uw_dJqTXdos";

const urlParams = new URLSearchParams(window.location.search);
const audioUrl = urlParams.get('audio');
const instUrl = urlParams.get('inst');
const duration = parseFloat(urlParams.get('duration') || "30");
const jobId = urlParams.get('job_id');
const jobDir = urlParams.get('job_dir');
const mainHz = parseFloat(urlParams.get('main_hz') || "0");
const accentHz = parseFloat(urlParams.get('accent_hz') || "0");
const bpm = parseFloat(urlParams.get('bpm') || "120");

// === STATE ===
let notes = [];
let gaps = [];
let moments = [];
let selectedNotes = [];
let selectedGap = null;
let selectedEdge = null;

let gapMode = false;
let pendingGapStart = null;
let momentMode = false;
let pendingMomentBox = { x1: null, x2: null };
let draggedMoment = null;
let dropTargetGapId = null;

let audioCtx = null;
let bassBus = null;
let masterGain = null;
let scheduledNodes = [];

// === AUDIO ===
function initAudio() {
    if (!instUrl) return;
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        bassBus = audioCtx.createGain();
        bassBus.gain.value = 1.0;

        const hp = audioCtx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.value = 20;
        hp.Q.value = 0.7;

        const comp = audioCtx.createDynamicsCompressor();
        comp.threshold.value = -12;
        comp.knee.value = 0;
        comp.ratio.value = 3;
        comp.attack.value = 0.003;
        comp.release.value = 0.1;

        masterGain = audioCtx.createGain();
        masterGain.gain.value = Math.pow(10, 9.0 / 20);

        bassBus.connect(hp);
        hp.connect(comp);
        comp.connect(masterGain);
        masterGain.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function applyEnvelope(gainNode, when, dur) {
    const attack = 0.003;
    const release = Math.min(0.08, dur * 0.3);
    const sustain = 0.55;
    if (dur <= attack + release + 0.01) {
        gainNode.gain.setValueAtTime(0, when);
        gainNode.gain.linearRampToValueAtTime(sustain, when + dur * 0.5);
        gainNode.gain.linearRampToValueAtTime(0, when + dur);
        return;
    }
    const decayTime = Math.min(dur * 0.3, dur - attack - release);
    gainNode.gain.setValueAtTime(0, when);
    gainNode.gain.linearRampToValueAtTime(1.0, when + attack);
    gainNode.gain.linearRampToValueAtTime(sustain, when + attack + decayTime);
    gainNode.gain.setValueAtTime(sustain, when + dur - release);
    gainNode.gain.linearRampToValueAtTime(0, when + dur);
}

function scheduleBass(fromTime) {
    if (!audioCtx) return;
    scheduledNodes.forEach(n => { try { n.stop(); } catch(e){} });
    scheduledNodes = [];
    const t0 = audioCtx.currentTime + 0.02;

    notes.forEach(note => {
        if (note.start + note.dur < fromTime) return;
        const actualStart = Math.max(note.start, fromTime);
        const offset = actualStart - note.start;
        const dur = note.dur - offset;
        if (dur < 0.03) return;
        const when = t0 + (actualStart - fromTime);

        const osc = audioCtx.createOscillator();
        const env = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = note.freq;
        applyEnvelope(env, when, dur);
        osc.connect(env);
        env.connect(bassBus);
        osc.start(when);
        osc.stop(when + dur + 0.02);
        scheduledNodes.push(osc);
    });
}

function stopBass() {
    scheduledNodes.forEach(n => { try { n.stop(); } catch(e){} });
    scheduledNodes = [];
}

function playNoteSound(freq) {
    initAudio();
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 0.005);
    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.2);
}

initAudio();

// === LOAD NOTES ===
if (jobId) {
    fetch(`${SUPABASE_URL}/rest/v1/temp_notes?id=eq.${jobId}&select=notes`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    })
    .then(res => res.json())
    .then(data => {
        if (data && data[0]) {
            notes = data[0].notes || [];
            notes.sort((a, b) => a.start - b.start);
            draw();
        }
    });
}

// === LAYOUT ===
const PPS = 100;
const WAVE_TOP = 30;
const WAVE_H = 130;
const NOTE_TOP = WAVE_TOP + WAVE_H + 10;
const NOTE_BOTTOM = 20;
const NOTE_H = 14;

const canvas = document.getElementById('notes-canvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('editor-container');
const playhead = document.getElementById('playhead');

function resizeCanvas() {
    const w = duration * PPS + 20;
    const h = Math.max(container.clientHeight, 300);
    canvas.width = w;
    canvas.height = h;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
}
resizeCanvas();
window.addEventListener('resize', () => { resizeCanvas(); draw(); });

const wavesurfer = WaveSurfer.create({
    container: '#waveform',
    waveColor: '#3a8eef',
    progressColor: '#ffffff33',
    height: WAVE_H,
    barWidth: 2,
    barGap: 1,
    minPxPerSec: PPS,
    fillParent: false,
    interact: false,
});

if (instUrl) wavesurfer.load(instUrl);
else if (audioUrl) wavesurfer.load(audioUrl);

wavesurfer.on('ready', () => { resizeCanvas(); draw(); });

// === DRAW ===
function freqToY(freq) {
    const noteAreaH = canvas.height - NOTE_TOP - NOTE_BOTTOM;
    const norm = Math.max(0, Math.min(1, (freq - 20) / 180));
    return NOTE_TOP + (1 - norm) * (noteAreaH - NOTE_H);
}

function drawBeatGrid() {
    if (!bpm || bpm <= 0) return;
    const beatDur = 60 / bpm;
    let t = 0, idx = 0;
    while (t <= duration + 0.001) {
        const x = t * PPS;
        const isBar = (idx % 4 === 0);
        ctx.strokeStyle = isBar ? '#2a2a5a' : '#1a1a2a';
        ctx.lineWidth = isBar ? 1.5 : 1;
        ctx.beginPath();
        ctx.moveTo(x, NOTE_TOP - 5);
        ctx.lineTo(x, canvas.height - NOTE_BOTTOM);
        ctx.stroke();
        t += beatDur;
        idx++;
    }
}

function drawGaps() {
    gaps.forEach(gap => {
        const x1 = gap.start * PPS;
        const x2 = gap.end * PPS;
        const w = x2 - x1;
        const isSel = (selectedGap && selectedGap.id === gap.id);
        const isTarget = (dropTargetGapId === gap.id);
        if (isTarget) ctx.fillStyle = 'rgba(122, 208, 122, 0.35)';
        else if (isSel) ctx.fillStyle = 'rgba(155, 89, 182, 0.30)';
        else ctx.fillStyle = 'rgba(155, 89, 182, 0.15)';
        ctx.fillRect(x1, NOTE_TOP, w, canvas.height - NOTE_TOP - NOTE_BOTTOM);

        ctx.strokeStyle = isTarget ? '#7ad07a' : (isSel ? '#c060ff' : '#9b59b6');
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x1, NOTE_TOP); ctx.lineTo(x1, canvas.height - NOTE_BOTTOM);
        ctx.moveTo(x2, NOTE_TOP); ctx.lineTo(x2, canvas.height - NOTE_BOTTOM);
        ctx.stroke();

        ctx.fillStyle = isTarget ? '#7ad07a' : '#c060ff';
        ctx.font = 'bold 11px Arial';
        ctx.fillText(gap.name, x1 + 4, NOTE_TOP + 12);
        ctx.font = '10px Arial';
        ctx.fillStyle = '#aaa';
        ctx.fillText((gap.end - gap.start).toFixed(2) + 's', x1 + 4, NOTE_TOP + 26);
    });
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBeatGrid();
    drawGaps();

    ctx.fillStyle = '#666';
    ctx.font = '11px Arial';
    for (let i = 0; i <= duration; i += 5) {
        ctx.fillText(i + 's', i * PPS + 3, 15);
    }

    notes.forEach(note => {
        const x = note.start * PPS;
        const w = Math.max(note.dur * PPS, 8);
        const y = freqToY(note.freq);
        const isSel = selectedNotes.includes(note);
        const isAccent = accentHz > 0 && Math.abs(note.freq - accentHz) < 0.5;
        const isMain = mainHz > 0 && Math.abs(note.freq - mainHz) < 0.5;
        let fill, outline;
        if (isSel) { fill = '#3a8eef'; outline = '#fff'; }
        else if (isAccent) { fill = '#ffaa00'; outline = '#803300'; }
        else if (isMain) { fill = '#7ad07a'; outline = '#2a5a2a'; }
        else { fill = '#5a9a8a'; outline = '#2a3a3a'; }
        ctx.fillStyle = fill;
        ctx.fillRect(x, y, w, NOTE_H);
        ctx.strokeStyle = outline;
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 0.5, y + 0.5, w - 1, NOTE_H - 1);
        if (w > 34) {
            ctx.fillStyle = 'rgba(0,0,0,0.85)';
            ctx.font = 'bold 10px Arial';
            ctx.fillText(note.freq.toFixed(0) + 'Hz', x + 3, y + 11);
        }
    });

    if (momentMode && pendingMomentBox.x1 !== null && pendingMomentBox.x2 !== null) {
        const x1 = Math.min(pendingMomentBox.x1, pendingMomentBox.x2) * PPS;
        const x2 = Math.max(pendingMomentBox.x1, pendingMomentBox.x2) * PPS;
        ctx.strokeStyle = '#c060ff';
        ctx.setLineDash([4, 4]);
        ctx.lineWidth = 2;
        ctx.strokeRect(x1, NOTE_TOP, x2 - x1, canvas.height - NOTE_TOP - NOTE_BOTTOM);
        ctx.setLineDash([]);
    }
}

// === HIT TEST ===
function hitTestNote(x, y) {
    for (let i = notes.length - 1; i >= 0; i--) {
        const note = notes[i];
        const nx = note.start * PPS;
        const nw = Math.max(note.dur * PPS, 8);
        const ny = freqToY(note.freq);
        if (x >= nx - 4 && x <= nx + nw + 4 && y >= ny - 6 && y <= ny + NOTE_H + 6) return note;
    }
    return null;
}

function hitTestGapEdge(x) {
    const tol = 14;
    for (const gap of gaps) {
        if (Math.abs(x - gap.start * PPS) < tol) return { gap, edge: 'start' };
        if (Math.abs(x - gap.end * PPS) < tol) return { gap, edge: 'end' };
    }
    return null;
}

// === TAP HANDLER ===
let lastTapTime = 0;
let lastTapGapId = null;
let lastTapEdge = null;

canvas.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 && e.pointerType === 'mouse') return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left + container.scrollLeft;
    const y = e.clientY - rect.top;
    handleTap(x, y);
});

function handleTap(x, y) {
    const time = x / PPS;

    if (gapMode) {
        if (pendingGapStart === null) {
            pendingGapStart = time;
            setHint(`Начало: ${time.toFixed(2)}s. Тапните в конец промежутка.`);
        } else {
            const start = Math.min(pendingGapStart, time);
            const end = Math.max(pendingGapStart, time);
            if (end - start < 0.1) {
                setHint('Слишком маленький. Ещё раз.');
                pendingGapStart = null;
                draw();
                return;
            }
            createGap(start, end);
            pendingGapStart = null;
            gapMode = false;
            document.getElementById('btn-gap').classList.remove('btn-active');
            setHint(`Создан: ${gaps[gaps.length - 1].name}`);
        }
        draw();
        return;
    }

    if (momentMode) {
        if (pendingMomentBox.x1 === null) {
            pendingMomentBox.x1 = time;
            setHint(`Начало выделения: ${time.toFixed(2)}s. Тапните в конец.`);
            draw();
            return;
        }
        pendingMomentBox.x2 = time;
        const x1 = Math.min(pendingMomentBox.x1, pendingMomentBox.x2);
        const x2 = Math.max(pendingMomentBox.x1, pendingMomentBox.x2);
        selectedNotes = notes.filter(n =>
            n.start >= x1 - 0.01 && n.start + n.dur <= x2 + 0.01
        );
        pendingMomentBox = { x1: null, x2: null };
        momentMode = false;
        document.getElementById('btn-moment').classList.remove('btn-active');
        if (selectedNotes.length === 0) {
            setHint('В этом диапазоне нет нот');
        } else {
            setHint(`Выделено ${selectedNotes.length} нот. Нажмите 💾 ещё раз`);
        }
        draw();
        return;
    }

    const edgeHit = hitTestGapEdge(x);
    if (edgeHit) {
        const now = Date.now();
        const isDouble = (now - lastTapTime < 400)
            && lastTapGapId === edgeHit.gap.id
            && lastTapEdge === edgeHit.edge;
        if (isDouble) {
            deleteGap(edgeHit.gap.id);
            lastTapTime = 0;
            lastTapGapId = null;
            lastTapEdge = null;
            draw();
            return;
        }
        selectedGap = edgeHit.gap;
        selectedEdge = edgeHit.edge;
        lastTapTime = now;
        lastTapGapId = edgeHit.gap.id;
        lastTapEdge = edgeHit.edge;
        setHint(`${edgeHit.gap.name}: ${edgeHit.edge === 'start' ? 'начало' : 'конец'} (← → двигать, двойной тап — удалить)`);
        draw();
        return;
    }

    const clickedNote = hitTestNote(x, y);
    if (clickedNote) {
        selectedNotes = [clickedNote];
        playNoteSound(clickedNote.freq);
        selectedGap = null;
        draw();
    } else {
        selectedNotes = [];
        selectedGap = null;
        draw();
    }
}

function setHint(text) {
    document.getElementById('hint').innerText = text;
}

// === GAP ===
function startGapSelection() {
    gapMode = true;
    pendingGapStart = null;
    document.getElementById('btn-gap').classList.add('btn-active');
    setHint('Тапните в место начала промежутка');
}

function createGap(start, end) {
    const id = 'gap_' + Date.now();
    const name = 'Промежуток ' + (gaps.length + 1);
    gaps.push({ id, name, start, end });
}

function deleteGap(gapId) {
    gaps = gaps.filter(g => g.id !== gapId);
    gaps.forEach((g, i) => { g.name = 'Промежуток ' + (i + 1); });
    if (selectedGap && selectedGap.id === gapId) selectedGap = null;
    setHint('Промежуток удалён');
}

function moveEdge(dir) {
    if (!selectedGap || !selectedEdge) {
        setHint('Тапните на границу промежутка');
        return;
    }
    const step = 0.01 * dir;
    if (selectedEdge === 'start') {
        selectedGap.start = Math.max(0, Math.min(selectedGap.start + step, selectedGap.end - 0.05));
    } else {
        selectedGap.end = Math.min(duration, Math.max(selectedGap.end + step, selectedGap.start + 0.05));
    }
    draw();
}

function cancelMode() {
    gapMode = false;
    momentMode = false;
    pendingGapStart = null;
    pendingMomentBox = { x1: null, x2: null };
    document.getElementById('btn-gap').classList.remove('btn-active');
    document.getElementById('btn-moment').classList.remove('btn-active');
    setHint('Отменено');
    draw();
}

// === MOMENT ===
function saveAsMoment() {
    if (selectedNotes.length === 0) {
        momentMode = true;
        pendingMomentBox = { x1: null, x2: null };
        document.getElementById('btn-moment').classList.add('btn-active');
        setHint('Тапните в место начала выделения');
        return;
    }
    if (moments.length >= 4) {
        setHint('Максимум 4 момента');
        return;
    }
    const sorted = [...selectedNotes].sort((a, b) => a.start - b.start);
    const baseStart = sorted[0].start;
    const momentNotes = sorted.map(n => ({
        start: n.start - baseStart,
        dur: n.dur,
        freq: n.freq,
    }));
    const id = 'mom_' + Date.now();
    const name = 'Момент ' + (moments.length + 1);
    moments.push({ id, name, notes: momentNotes });
    renderMomentsPanel();
    setHint(`Сохранён ${name} (${momentNotes.length} нот) — перетащите в промежуток`);
    selectedNotes = [];
    draw();
}

function renderMomentsPanel() {
    const panel = document.getElementById('moments-panel');
    if (moments.length === 0) {
        panel.innerHTML = '<div style="color:#555;font-size:11px;padding:0 10px;">Моменты появятся здесь после 💾</div>';
        return;
    }
    panel.innerHTML = moments.map(m => `
        <div class="moment-chip-wrap">
            <div class="moment-chip" data-moment-id="${m.id}">
                <span>${m.name}</span>
                <span class="sub">${m.notes.length} нот · ${(m.notes[m.notes.length - 1].start + m.notes[m.notes.length - 1].dur).toFixed(2)}s</span>
            </div>
            <div class="moment-del" data-del-moment="${m.id}">×</div>
        </div>
    `).join('');

    panel.querySelectorAll('[data-del-moment]').forEach(el => {
        el.addEventListener('click', (e) => {
            e.stopPropagation();
            deleteMoment(el.dataset.delMoment);
        });
    });

    panel.querySelectorAll('.moment-chip').forEach(chip => {
        chip.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            const id = chip.dataset.momentId;
            draggedMoment = moments.find(m => m.id === id);
            chip.setPointerCapture(e.pointerId);
            setHint(`Тащите "${draggedMoment.name}" в промежуток`);
        });
        chip.addEventListener('pointermove', (e) => {
            if (!draggedMoment) return;
            const rect = canvas.getBoundingClientRect();
            const inCanvas = e.clientY > rect.top && e.clientY < rect.top + canvas.height;
            if (inCanvas) {
                const x = e.clientX - rect.left + container.scrollLeft;
                const t = x / PPS;
                const target = gaps.find(g => t >= g.start && t <= g.end);
                dropTargetGapId = target ? target.id : null;
                if (target) setHint(`Отпустите → в ${target.name}`);
                draw();
            } else {
                if (dropTargetGapId) { dropTargetGapId = null; draw(); }
            }
        });
        chip.addEventListener('pointerup', (e) => {
            if (!draggedMoment) return;
            const rect = canvas.getBoundingClientRect();
            if (e.clientY > rect.top && e.clientY < rect.top + canvas.height) {
                const x = e.clientX - rect.left + container.scrollLeft;
                const t = x / PPS;
                const target = gaps.find(g => t >= g.start && t <= g.end);
                if (target) {
                    insertMomentIntoGap(draggedMoment, target);
                } else {
                    setHint('Отпущено не над промежутком');
                }
            }
            draggedMoment = null;
            dropTargetGapId = null;
            draw();
        });
        chip.addEventListener('pointercancel', () => {
            draggedMoment = null;
            dropTargetGapId = null;
            draw();
        });
    });
}

function deleteMoment(momentId) {
    moments = moments.filter(m => m.id !== momentId);
    moments.forEach((m, i) => { m.name = 'Момент ' + (i + 1); });
    renderMomentsPanel();
    setHint('Момент удалён');
}

function insertMomentIntoGap(moment, gap) {
    notes = notes.filter(n => !(n.start >= gap.start - 0.01 && n.start < gap.end + 0.01));

    moment.notes.forEach(mn => {
        const newStart = gap.start + mn.start;
        const newEnd = Math.min(newStart + mn.dur, gap.end);
        const finalDur = newEnd - newStart;
        if (finalDur >= 0.03) {
            notes.push({ start: newStart, dur: finalDur, freq: mn.freq });
        }
    });

    notes.sort((a, b) => a.start - b.start);
    setHint(`${moment.name} вставлен в ${gap.name}`);
    rescheduleIfPlaying();
    draw();
}

// === EDIT ===
function splitNote() {
    if (selectedNotes.length !== 1) return setHint('Выберите одну ноту');
    const note = selectedNotes[0];
    const idx = notes.indexOf(note);
    if (idx === -1) return;
    const halfDur = note.dur / 2;
    if (halfDur < 0.05) return setHint('Слишком короткая');
    const newNote = { start: note.start + halfDur, freq: note.freq, dur: halfDur };
    note.dur = halfDur;
    notes.splice(idx + 1, 0, newNote);
    selectedNotes = [];
    draw();
    playNoteSound(note.freq);
    rescheduleIfPlaying();
}

function joinNotes() {
    if (selectedNotes.length < 2) return setHint('Выберите 2+');
    const sorted = [...selectedNotes].sort((a, b) => a.start - b.start);
    const start = sorted[0].start;
    const end = sorted[sorted.length - 1].start + sorted[sorted.length - 1].dur;
    const freq = sorted[0].freq;
    const newNote = { start, freq, dur: end - start };
    notes = notes.filter(n => !selectedNotes.includes(n));
    notes.push(newNote);
    notes.sort((a, b) => a.start - b.start);
    selectedNotes = [];
    draw();
    playNoteSound(newNote.freq);
    rescheduleIfPlaying();
}

// === PLAYBACK ===
function togglePlay() {
    initAudio();
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (wavesurfer.isPlaying()) {
        wavesurfer.pause();
        stopBass();
        document.getElementById('play-btn').innerText = '▶';
    } else {
        wavesurfer.play();
        scheduleBass(wavesurfer.getCurrentTime());
        document.getElementById('play-btn').innerText = '⏸';
    }
}

function rescheduleIfPlaying() {
    if (wavesurfer.isPlaying()) {
        stopBass();
        scheduleBass(wavesurfer.getCurrentTime());
    }
}

wavesurfer.on('audioprocess', () => {
    const time = wavesurfer.getCurrentTime();
    document.getElementById('timer').innerText = formatTime(time) + ' / ' + formatTime(duration);
    const x = time * PPS;
    playhead.style.left = x + 'px';
    playhead.style.display = 'block';
    const w = container.clientWidth;
    if (x > w / 2) container.scrollLeft = x - w / 2;
});

wavesurfer.on('seek', () => {
    const time = wavesurfer.getCurrentTime();
    playhead.style.left = (time * PPS) + 'px';
    if (wavesurfer.isPlaying()) scheduleBass(time);
});

wavesurfer.on('pause', () => {
    playhead.style.display = 'none';
    stopBass();
    document.getElementById('play-btn').innerText = '▶';
});
wavesurfer.on('finish', () => {
    playhead.style.display = 'none';
    stopBass();
    document.getElementById('play-btn').innerText = '▶';
});

function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
}

// === SLIDERS ===
document.getElementById('vol-inst').addEventListener('input', (e) => {
    const val = e.target.value;
    document.getElementById('val-inst').innerText = val + '%';
    wavesurfer.setVolume(val / 100);
});

document.getElementById('vol-bass').addEventListener('input', (e) => {
    const val = parseFloat(e.target.value);
    document.getElementById('val-bass').innerText = val + ' dB';
    initAudio();
    if (masterGain) {
        const finalDb = 9.0 + val;
        masterGain.gain.value = Math.pow(10, finalDb / 20);
    }
});

// === SAVE ===
async function save() {
    const sliderBass = parseFloat(document.getElementById('vol-bass').value);
    const finalBassDb = 9.0 + sliderBass;
    try {
        await fetch(`${SUPABASE_URL}/rest/v1/temp_notes?id=eq.${jobId}`, {
            method: 'PATCH',
            headers: {
                'apikey': SUPABASE_KEY,
                'Authorization': `Bearer ${SUPABASE_KEY}`,
                'Content-Type': 'application/json',
                'Prefer': 'return=minimal'
            },
            body: JSON.stringify({ notes })
        });
    } catch(e) { console.error(e); }
    tg.sendData(JSON.stringify({
        job_id: jobId,
        job_dir: jobDir,
        vol_inst: document.getElementById('vol-inst').value,
        vol_bass: finalBassDb,
    }));
    tg.close();
}

// === INIT ===
renderMomentsPanel();
setTimeout(draw, 200);
setTimeout(draw, 800);
</script>
