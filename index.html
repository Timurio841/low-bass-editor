<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/wavesurfer.js@7"></script>
    <style>
        * { box-sizing: border-box; touch-action: none; }
        body { margin: 0; background: #141414; color: white; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .header { display: flex; justify-content: space-between; padding: 10px; background: #1a1a1a; align-items: center; }
        .time { color: #4a9eff; font-weight: bold; font-size: 14px; }

        .editor-container { flex-grow: 1; position: relative; overflow-x: auto; overflow-y: hidden; background: #0d0d0d; }
        #waveform { position: absolute; top: 50px; left: 0; height: 150px; }
        #notes-canvas { position: absolute; top: 0; left: 0; height: 100%; z-index: 10; }

        #playhead {
            position: absolute; top: 0; bottom: 0; width: 2px; background: #ff4444;
            z-index: 15; display: none; pointer-events: none; box-shadow: 0 0 5px #ff4444;
        }

        .controls { background: #1a1a1a; padding: 10px; display: flex; flex-direction: column; gap: 5px; z-index: 20; }
        .slider-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #aaa; }
        .slider-row input { width: 50%; accent-color: #3a8eef; }
        .val { width: 50px; text-align: right; color: #fff; font-weight: bold; }

        .actions { display: flex; gap: 5px; padding: 10px; background: #141414; z-index: 20; flex-wrap: wrap; }
        .btn { flex: 1; min-width: 70px; padding: 12px 5px; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; color: white; }
        .btn-green { background: #7ad07a; color: black; }
        .btn-gray { background: #333; }
        .btn-blue { background: #3a8eef; }
        .btn-orange { background: #ffaa00; color: black; }
    </style>
</head>
<body>
    <div class="header">
        <span>🎛 Low Bass Editor</span>
        <span class="time" id="timer">0:00 / 0:00</span>
    </div>
    <div class="editor-container" id="editor-container">
        <div id="waveform"></div>
        <canvas id="notes-canvas"></canvas>
        <div id="playhead"></div>
    </div>
    <div class="controls">
        <div class="slider-row">
            <span>Инструментал</span>
            <input type="range" id="vol-inst" min="0" max="200" value="100">
            <span class="val" id="val-inst">100%</span>
        </div>
        <div class="slider-row">
            <span>Бас</span>
            <input type="range" id="vol-bass" min="-10" max="10" value="0">
            <span class="val" id="val-bass">0 dB</span>
        </div>
    </div>
    <div class="actions">
        <button class="btn btn-gray" onclick="tg.close()">Отмена</button>
        <button class="btn btn-blue" onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button class="btn btn-green" onclick="save()">✓ Готово</button>
    </div>
    <div class="actions">
        <button class="btn btn-gray" onclick="splitNote()">✂ Разделить</button>
        <button class="btn btn-gray" onclick="joinNotes()">🔗 Объединить</button>
        <button class="btn btn-orange" onclick="changeFreq(-1)">- Частота</button>
        <button class="btn btn-orange" onclick="changeFreq(1)">+ Частота</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const SUPABASE_URL = "https://nizngtkkmqqyhuyqhold.supabase.co";
        const SUPABASE_KEY = "sb_publishable_ryrnxleq02WsQ7fcqPL3uw_dJqTXdos";

        const urlParams = new URLSearchParams(window.location.search);
        const audioUrl = urlParams.get('audio');
        const instUrl = urlParams.get('inst');
        const duration = parseFloat(urlParams.get('duration') || "30");
        const jobId = urlParams.get('job_id');
        const jobDir = urlParams.get('job_dir'); // [FIX] путь к папке джобы

        let notes = [];
        let selectedNotes = [];
        let dragStartPositions = {};
        let isSynthMode = false;

        // === WEB AUDIO API (БАС) ===
        let audioCtx = null;
        let bassGainNode = null;
        let scheduledNodes = [];

        function initAudio() {
            if (!instUrl) return;
            isSynthMode = true;
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                bassGainNode = audioCtx.createGain();
                bassGainNode.connect(audioCtx.destination);
                bassGainNode.gain.value = Math.pow(10, 7.0 / 20);
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        // [FIX] инициализируем сразу — слайдер баса работает до нажатия Play
        initAudio();

        function scheduleBass(fromTime) {
            if (!isSynthMode || !audioCtx) return;
            scheduledNodes.forEach(n => { try { n.stop(); } catch(e){} });
            scheduledNodes = [];

            let audioStartTime = audioCtx.currentTime;

            notes.forEach(note => {
                if (note.start + note.dur < fromTime) return;

                let actualStart = Math.max(note.start, fromTime);
                let offset = actualStart - note.start;
                let dur = note.dur - offset;
                if (dur < 0.05) return;

                let when = audioStartTime + (actualStart - fromTime);

                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.value = note.freq;

                let attack = 0.01;
                let release = 0.09;
                let sustain = 0.55;

                gain.gain.setValueAtTime(0, when);
                gain.gain.linearRampToValueAtTime(1, when + attack);

                let decayEnd = when + attack + 0.3 * dur;
                if (decayEnd > when + dur - release) decayEnd = when + dur - release;
                if (decayEnd < when + attack) decayEnd = when + attack;

                gain.gain.linearRampToValueAtTime(sustain, decayEnd);
                gain.gain.setValueAtTime(sustain, when + dur - release);
                gain.gain.linearRampToValueAtTime(0, when + dur);

                osc.connect(gain);
                gain.connect(bassGainNode);

                osc.start(when);
                osc.stop(when + dur);
                scheduledNodes.push(osc);
            });
        }

        function stopBass() {
            scheduledNodes.forEach(n => { try { n.stop(); } catch(e){} });
            scheduledNodes = [];
        }

        function playNoteSound(freq) {
            initAudio();
            if (!isSynthMode || !audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let playableFreq = freq * 4;
            if (playableFreq < 60) playableFreq = 60;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = playableFreq;
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        if (jobId) {
            fetch(`${SUPABASE_URL}/rest/v1/temp_notes?id=eq.${jobId}&select=notes`, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            })
            .then(res => res.json())
            .then(data => {
                if (data && data[0]) {
                    notes = data[0].notes;
                    draw();
                }
            });
        }

        const PPS = 100;
        const canvas = document.getElementById('notes-canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('editor-container');
        const playhead = document.getElementById('playhead');

        const wavesurfer = WaveSurfer.create({
            container: '#waveform',
            waveColor: '#3a8eef', progressColor: 'transparent',
            height: 150, barWidth: 2, barGap: 1, minPxPerSec: PPS
        });

        if (instUrl) wavesurfer.load(instUrl);
        else if (audioUrl) wavesurfer.load(audioUrl);

        canvas.width = duration * PPS;
        canvas.height = container.clientHeight;
        document.getElementById('waveform').style.width = (duration * PPS) + 'px';

        let isDragging = false, startX = 0;

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#333';
            for (let i = 0; i <= duration; i++) {
                let x = i * PPS;
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
                if (i % 5 === 0) {
                    ctx.fillStyle = '#666'; ctx.font = '12px Arial';
                    ctx.fillText(i + 's', x + 5, 20);
                }
            }

            notes.forEach(note => {
                let x = note.start * PPS;
                let y = canvas.height - 100;
                let w = note.dur * PPS;
                let isSel = selectedNotes.includes(note);
                ctx.fillStyle = isSel ? '#ffaa00' : (note.freq > 30 ? '#ff9900' : '#7ad07a');
                ctx.fillRect(x, y, Math.max(w, 10), 20);
                ctx.fillStyle = 'black'; ctx.font = '12px Arial';
                ctx.fillText(note.freq + 'Hz', x + 2, y + 15);
            });
        }

        canvas.addEventListener('touchstart', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.touches[0].clientX - rect.left + container.scrollLeft;
            const y = e.touches[0].clientY - rect.top;

            let clickedNote = null;
            for (let note of notes) {
                let nx = note.start * PPS;
                let ny = canvas.height - 100;
                let nw = Math.max(note.dur * PPS, 15);

                if (x >= nx - 10 && x <= nx + nw + 10 && y >= ny - 20 && y <= ny + 40) {
                    clickedNote = note;
                    isDragging = true;
                    startX = x;
                    break;
                }
            }

            if (clickedNote) {
                if (!selectedNotes.includes(clickedNote)) {
                    selectedNotes = [clickedNote];
                }
                dragStartPositions = {};
                selectedNotes.forEach(n => dragStartPositions[n] = n.start);
                playNoteSound(clickedNote.freq);
            } else {
                selectedNotes = [];
            }
            draw();
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!isDragging || selectedNotes.length === 0) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.touches[0].clientX - rect.left + container.scrollLeft;
            let delta = (x - startX) / PPS;

            selectedNotes.forEach(n => {
                n.start = Math.max(0, dragStartPositions[n] + delta);
            });
            draw();
            rescheduleIfPlaying();
        });

        canvas.addEventListener('touchend', () => { isDragging = false; });

        function togglePlay() {
            initAudio();
            if (!audioCtx) { alert("Аудио контекст не инициализирован"); return; }
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (wavesurfer.isPlaying()) {
                wavesurfer.pause();
                stopBass();
            } else {
                wavesurfer.play();
                scheduleBass(wavesurfer.getCurrentTime());
            }
            document.getElementById('play-btn').innerText = wavesurfer.isPlaying() ? "⏸ Pause" : "▶ Play";
        }

        function rescheduleIfPlaying() {
            if (isSynthMode && wavesurfer.isPlaying()) {
                stopBass();
                scheduleBass(wavesurfer.getCurrentTime());
            }
        }

        wavesurfer.on('audioprocess', () => {
            let time = wavesurfer.getCurrentTime();
            document.getElementById('timer').innerText = formatTime(time) + ' / ' + formatTime(duration);

            let currentX = time * PPS;
            playhead.style.left = currentX + 'px';
            playhead.style.display = 'block';

            let w = container.clientWidth;
            if (currentX > w / 2) {
                container.scrollLeft = currentX - (w / 2);
            }
        });

        wavesurfer.on('seek', () => {
            let time = wavesurfer.getCurrentTime();
            let currentX = time * PPS;
            playhead.style.left = currentX + 'px';
            if (wavesurfer.isPlaying()) {
                scheduleBass(time);
            }
        });

        wavesurfer.on('pause', () => { playhead.style.display = 'none'; stopBass(); });
        wavesurfer.on('finish', () => { playhead.style.display = 'none'; stopBass(); });

        function formatTime(sec) {
            let m = Math.floor(sec / 60); let s = Math.floor(sec % 60);
            return m + ":" + (s < 10 ? "0" : "") + s;
        }

        function splitNote() {
            if (selectedNotes.length !== 1) return alert("Выберите одну ноту");
            let note = selectedNotes[0];
            let idx = notes.indexOf(note);
            if (idx === -1) return;
            let halfDur = note.dur / 2;
            if (halfDur < 0.05) return alert("Нота слишком короткая");

            let newNote = {start: note.start + halfDur, freq: note.freq, dur: halfDur};
            note.dur = halfDur;
            notes.splice(idx + 1, 0, newNote);
            selectedNotes = [];
            draw();
            playNoteSound(note.freq);
            rescheduleIfPlaying();
        }

        function joinNotes() {
            if (selectedNotes.length < 2) return alert("Выберите 2 или более нот");
            let sorted = [...selectedNotes].sort((a,b) => a.start - b.start);
            let start = sorted[0].start;
            let end = sorted[sorted.length-1].start + sorted[sorted.length-1].dur;
            let freq = sorted[0].freq;

            let newNote = {start: start, freq: freq, dur: end - start};
            notes = notes.filter(n => !selectedNotes.includes(n));
            notes.push(newNote);
            notes.sort((a,b) => a.start - b.start);
            selectedNotes = [];
            draw();
            playNoteSound(newNote.freq);
            rescheduleIfPlaying();
        }

        function changeFreq(delta) {
            if (selectedNotes.length === 0) return alert("Выберите ноту");
            selectedNotes.forEach(n => {
                n.freq = Math.max(15, n.freq + delta);
                playNoteSound(n.freq);
            });
            draw();
            rescheduleIfPlaying();
        }

        document.getElementById('vol-inst').addEventListener('input', (e) => {
            let val = e.target.value;
            document.getElementById('val-inst').innerText = val + '%';
            wavesurfer.setVolume(val / 100);
        });

        document.getElementById('vol-bass').addEventListener('input', (e) => {
            let val = parseFloat(e.target.value);
            document.getElementById('val-bass').innerText = val + ' dB';
            initAudio(); // [FIX] защита от null bassGainNode
            if (bassGainNode) {
                let finalDb = 7.0 + val;
                bassGainNode.gain.value = Math.pow(10, finalDb / 20);
            }
        });

        async function save() {
            let sliderBass = parseFloat(document.getElementById('vol-bass').value);
            let finalBassDb = 7.0 + sliderBass;

            try {
                await fetch(`${SUPABASE_URL}/rest/v1/temp_notes?id=eq.${jobId}`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({ notes: notes })
                });
            } catch(e) { console.error(e); }

            const data = {
                job_id: jobId,
                job_dir: jobDir, // [FIX] возвращаем в бота
                vol_inst: document.getElementById('vol-inst').value,
                vol_bass: finalBassDb
            };
            tg.sendData(JSON.stringify(data));
            tg.close();
        }

        setTimeout(draw, 500);
    </script>
</body>
</html>
