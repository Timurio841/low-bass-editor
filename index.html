<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/wavesurfer.js@7"></script>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #141414; color: white; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

.header { display: flex; justify-content: space-between; padding: 8px 10px; background: #1a1a1a; align-items: center; gap: 8px; font-size: 13px; }
.time { color: #4a9eff; font-weight: bold; font-size: 13px; }
.mode-badge { padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }
.mode-draft { background: #7ad07a; color: #000; }
.mode-live { background: #9b59b6; color: #fff; }

.moments-panel { display: flex; gap: 6px; padding: 8px; background: #0f0f0f; overflow-x: auto; min-height: 62px; align-items: center; }
.moment-chip-wrap { position: relative; flex-shrink: 0; }
.moment-chip { min-width: 74px; padding: 8px 10px; background: #9b59b6; border-radius: 8px; font-size: 11px; font-weight: bold; display: flex; flex-direction: column; gap: 2px; user-select: none; touch-action: none; cursor: grab; }
.moment-chip:active { cursor: grabbing; }
.moment-chip .sub { font-size: 10px; opacity: 0.75; font-weight: normal; }
.moment-del { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; background: #ff4444; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #fff; cursor: pointer; z-index: 2; }

.editor-container { flex-grow: 1; position: relative; overflow-x: auto; overflow-y: hidden; background: #0d0d0d; touch-action: pan-x; }
#waveform { position: absolute; top: 30px; left: 0; height: 130px; cursor: pointer; }
#notes-canvas { position: absolute; top: 0; left: 0; z-index: 10; touch-action: none; }
#playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: #ff4444; z-index: 15; display: none; pointer-events: none; box-shadow: 0 0 5px #ff4444; }

.controls { background: #1a1a1a; padding: 8px; display: flex; flex-direction: column; gap: 4px; z-index: 20; }
.slider-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #aaa; }
.slider-row input { width: 50%; accent-color: #3a8eef; }
.val { width: 55px; text-align: right; color: #fff; font-weight: bold; }

.actions { display: flex; gap: 4px; padding: 6px 8px; background: #141414; z-index: 20; }
.btn { flex: 1; min-width: 50px; padding: 10px 3px; border: none; border-radius: 8px; font-weight: bold; font-size: 12px; color: white; transition: box-shadow 0.15s; }
.btn-green { background: #7ad07a; color: black; }
.btn-gray { background: #333; }
.btn-blue { background: #3a8eef; }
.btn-orange { background: #ffaa00; color: black; }
.btn-purple { background: #9b59b6; }
.btn-red { background: #ff4444; }
.btn-cyan { background: #00bcd4; color: black; }
.btn-active { box-shadow: 0 0 0 2px #fff inset; }

.hint { padding: 5px 10px; background: #2a2a2a; color: #ffaa00; font-size: 11px; text-align: center; min-height: 22px; }
</style>
</head>
<body>
<div class="header">
    <span>🎛 Low Bass</span>
    <span class="mode-badge mode-draft" id="mode-badge">📼 Черновик</span>
    <span class="time" id="timer">0:00 / 0:00</span>
</div>

<div class="moments-panel" id="moments-panel"></div>
<div class="hint" id="hint">Тап по волне/пустому месту — перемотка. 🎹 Живой — слышны правки.</div>

<div class="editor-container" id="editor-container">
    <div id="waveform"></div>
    <canvas id="notes-canvas"></canvas>
    <div id="playhead"></div>
</div>

<div class="controls">
    <div class="slider-row">
        <span>Инстр</span>
        <input type="range" id="vol-inst" min="0" max="200" value="100">
        <span class="val" id="val-inst">100%</span>
    </div>
</div>

<div class="actions">
    <button class="btn btn-gray" onclick="tg.close()">✕</button>
    <button class="btn btn-blue" onclick="togglePlay()" id="play-btn">▶</button>
    <button class="btn btn-purple" onclick="toggleMode()" id="mode-btn">🎹 Живой</button>
    <button class="btn btn-green" onclick="save()">✓ Готово</button>
</div>

<div class="actions">
    <button class="btn btn-gray" onclick="startGapSelection()" id="btn-gap">📍 Промежуток</button>
    <button class="btn btn-purple" onclick="saveAsMoment()" id="btn-moment">💾 Момент</button>
    <button class="btn btn-red" onclick="cancelMode()">✕ Отмена</button>
</div>

<div class="actions">
    <button class="btn btn-orange" onclick="moveEdge(-1)">←</button>
    <button class="btn btn-orange" onclick="moveEdge(1)">→</button>
    <button class="btn btn-orange" onclick="autoFillSelectedGap()" id="btn-auto">⚡ Авто</button>
    <button class="btn btn-red" onclick="deleteSelectedGap()" id="btn-del-gap">🗑</button>
</div>

<div class="actions">
    <button class="btn btn-cyan" onclick="autoDetectAndFillEmpty()" id="btn-find-empty">🔍 Пустоты</button>
    <button class="btn btn-cyan" onclick="splitLongNotesByKicks()" id="btn-cut-long">✂️ Длинные</button>
</div>

<div class="actions">
    <button class="btn btn-gray" onclick="splitNote()">✂</button>
    <button class="btn btn-gray" onclick="joinNotes()">🔗</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const SUPABASE_URL = "https://nizngtkkmqqyhuyqhold.supabase.co";
const SUPABASE_KEY = "sb_publishable_ryrnxleq02WsQ7fcqPL3uw_dJqTXdos";

const urlParams = new URLSearchParams(window.location.search);
const audioUrl = urlParams.get('audio');
const instUrl = urlParams.get('inst');
const bassUrl = urlParams.get('bass');
const duration = parseFloat(urlParams.get('duration') || "30");
const jobId = urlParams.get('job_id');
const jobDir = urlParams.get('job_dir');
const mainHz = parseFloat(urlParams.get('main_hz') || "0");
const accentHz = parseFloat(urlParams.get('accent_hz') || "0");
const bpm = parseFloat(urlParams.get('bpm') || "120");

let kicks = [];
const kicksStr = urlParams.get('kicks');
if (kicksStr) {
    kicks = kicksStr.split(',').map(s => parseFloat(s)).filter(k => !isNaN(k) && k >= 0);
}
console.log('[kicks]', kicks.length);

function getKicks() {
    if (kicks.length > 0) return kicks;
    if (!bpm || bpm <= 0) return [];
    const beat = 60 / bpm;
    const arr = [];
    for (let t = 0; t < duration; t += beat) arr.push(t);
    return arr;
}

let notes = [];
let gaps = [];
let moments = [];
let selectedNotes = [];
let selectedGap = null;
let selectedEdge = null;

let gapMode = false;
let pendingGapStart = null;
let momentMode = false;
let pendingMomentBox = { x1: null, x2: null };
let draggedMoment = null;
let dropTargetGapId = null;

// 'draft' = result.mp3 | 'live' = inst.mp3 + синтез из notes
let currentMode = 'draft';

let audioCtx = null;
let liveSynthNodes = [];
let liveBassGain = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTapSound(freq) {
    initAudio();
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    const t = audioCtx.currentTime;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.06, t + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.15);
}

if (jobId) {
    fetch(`${SUPABASE_URL}/rest/v1/temp_notes?id=eq.${jobId}&select=notes`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    })
    .then(res => res.json())
    .then(data => {
        if (data && data[0]) {
            notes = data[0].notes || [];
            notes.sort((a, b) => a.start - b.start);
            draw();
        }
    });
}

const PPS = 100;
const WAVE_TOP = 30;
const WAVE_H = 130;
const NOTE_TOP = WAVE_TOP + WAVE_H + 10;
const NOTE_BOTTOM = 20;
const NOTE_H = 14;

const canvas = document.getElementById('notes-canvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('editor-container');
const playhead = document.getElementById('playhead');
const waveformEl = document.getElementById('waveform');

function resizeCanvas() {
    const w = duration * PPS + 20;
    const h = Math.max(container.clientHeight, 300);
    canvas.width = w;
    canvas.height = h;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    waveformEl.style.width = w + 'px';
}
resizeCanvas();
window.addEventListener('resize', () => { resizeCanvas(); draw(); });

const wavesurfer = WaveSurfer.create({
    container: '#waveform',
    waveColor: '#3a8eef',
    progressColor: '#ffffff33',
    height: WAVE_H,
    barWidth: 2,
    barGap: 1,
    minPxPerSec: PPS,
    fillParent: false,
    interact: false,
});

if (audioUrl) wavesurfer.load(audioUrl);
else if (instUrl) wavesurfer.load(instUrl);

wavesurfer.on('ready', () => { resizeCanvas(); draw(); });

// ============ ПЕРЕМОТКА ПО ВОЛНЕ ============
waveformEl.addEventListener('pointerdown', (e) => {
    if (gapMode) return; // не мешаем режиму создания промежутка
    const rect = waveformEl.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const time = Math.max(0, Math.min(duration, x / PPS));
    seekTo(time);
});

// ============ LIVE SYNTH ============
function startLiveSynth(fromTime) {
    if (currentMode !== 'live') return;
    initAudio();
    if (!audioCtx) return;
    audioCtx.resume();
    stopLiveSynth();

    const t0 = audioCtx.currentTime + 0.05;

    if (!liveBassGain) {
        liveBassGain = audioCtx.createGain();
        liveBassGain.gain.value = Math.pow(10, 9.0 / 20);

        const hp = audioCtx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.value = 20;

        const comp = audioCtx.createDynamicsCompressor();
        comp.threshold.value = -12;
        comp.knee.value = 0;
        comp.ratio.value = 3;
        comp.attack.value = 0.003;
        comp.release.value = 0.1;

        liveBassGain.connect(hp);
        hp.connect(comp);
        comp.connect(audioCtx.destination);
    }

    let count = 0;
    for (const note of notes) {
        if (note.start + note.dur < fromTime) continue;
        const actualStart = Math.max(note.start, fromTime);
        const offset = actualStart - note.start;
        const dur = note.dur - offset;
        if (dur < 0.03) continue;
        const when = t0 + (actualStart - fromTime);

        const osc = audioCtx.createOscillator();
        const env = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = note.freq;

        const A = 0.003;
        const R = Math.min(0.08, dur * 0.3);
        const S = 0.55;
        env.gain.setValueAtTime(0, when);
        if (dur > A + R + 0.01) {
            const decayT = Math.min(dur * 0.3, dur - A - R);
            env.gain.linearRampToValueAtTime(1.0, when + A);
            env.gain.linearRampToValueAtTime(S, when + A + decayT);
            env.gain.setValueAtTime(S, when + dur - R);
            env.gain.linearRampToValueAtTime(0, when + dur);
        } else {
            env.gain.linearRampToValueAtTime(S, when + dur * 0.5);
            env.gain.linearRampToValueAtTime(0, when + dur);
        }

        osc.connect(env);
        env.connect(liveBassGain);
        osc.start(when);
        osc.stop(when + dur + 0.02);
        liveSynthNodes.push(osc);
        count++;
    }
    console.log(`[live] синтез ${count} нот с ${fromTime.toFixed(2)}s`);
}

function stopLiveSynth() {
    liveSynthNodes.forEach(n => { try { n.stop(); } catch(e){} });
    liveSynthNodes = [];
}

function resynthIfLive() {
    if (currentMode === 'live' && wavesurfer.isPlaying()) {
        stopLiveSynth();
        startLiveSynth(wavesurfer.getCurrentTime());
    }
}

function afterEdit() {
    resynthIfLive();
    draw();
}

// ============ ПЕРЕКЛЮЧЕНИЕ РЕЖИМА ============
async function switchToLive() {
    if (currentMode === 'live') return;
    if (!instUrl) { setHint('Нет inst.mp3'); return; }

    const wasPlaying = wavesurfer.isPlaying();
    const curTime = wavesurfer.getCurrentTime();

    stopLiveSynth();
    currentMode = 'live';
    updateModeBadge();

    try {
        await wavesurfer.load(instUrl);
        wavesurfer.setVolume(parseFloat(document.getElementById('vol-inst').value) / 100);
        wavesurfer.seekTo(curTime / Math.max(duration, 0.001));
        if (wasPlaying) {
            await wavesurfer.play();
            startLiveSynth(curTime);
        }
        setHint('🎹 Живой режим: правки слышны сразу');
    } catch(e) {
        console.error(e);
        setHint('Ошибка загрузки inst');
    }
}

async function switchToDraft() {
    if (currentMode === 'draft') return;
    if (!audioUrl) { setHint('Нет result.mp3'); return; }

    const wasPlaying = wavesurfer.isPlaying();
    const curTime = wavesurfer.getCurrentTime();

    stopLiveSynth();
    currentMode = 'draft';
    updateModeBadge();

    try {
        await wavesurfer.load(audioUrl);
        wavesurfer.setVolume(parseFloat(document.getElementById('vol-inst').value) / 100);
        wavesurfer.seekTo(curTime / Math.max(duration, 0.001));
        if (wasPlaying) await wavesurfer.play();
        setHint('📼 Черновик: звук 1:1 как result.mp3');
    } catch(e) {
        console.error(e);
        setHint('Ошибка загрузки result');
    }
}

function toggleMode() {
    if (currentMode === 'draft') switchToLive();
    else switchToDraft();
}

function updateModeBadge() {
    const badge = document.getElementById('mode-badge');
    const btn = document.getElementById('mode-btn');
    if (currentMode === 'live') {
        badge.innerText = '🎹 Живой';
        badge.className = 'mode-badge mode-live';
        btn.innerText = '📼 Черновик';
    } else {
        badge.innerText = '📼 Черновик';
        badge.className = 'mode-badge mode-draft';
        btn.innerText = '🎹 Живой';
    }
}

// ============ SEEK ============
function seekTo(time) {
    time = Math.max(0, Math.min(duration, time));
    const ratio = time / Math.max(duration, 0.001);
    wavesurfer.seekTo(ratio);
    playhead.style.left = (time * PPS) + 'px';
    playhead.style.display = 'block';

    if (currentMode === 'live' && wavesurfer.isPlaying()) {
        stopLiveSynth();
        startLiveSynth(time);
    }
    const w = container.clientWidth;
    const x = time * PPS;
    if (x > w / 2) container.scrollLeft = x - w / 2;
}

// ============ DRAW ============
function freqToY(freq) {
    const noteAreaH = canvas.height - NOTE_TOP - NOTE_BOTTOM;
    const norm = Math.max(0, Math.min(1, (freq - 20) / 180));
    return NOTE_TOP + (1 - norm) * (noteAreaH - NOTE_H);
}

function drawBeatGrid() {
    if (!bpm || bpm <= 0) return;
    const beatDur = 60 / bpm;
    let t = 0, idx = 0;
    while (t <= duration + 0.001) {
        const x = t * PPS;
        const isBar = (idx % 4 === 0);
        ctx.strokeStyle = isBar ? '#2a2a5a' : '#181825';
        ctx.lineWidth = isBar ? 1.5 : 1;
        ctx.beginPath();
        ctx.moveTo(x, NOTE_TOP - 5);
        ctx.lineTo(x, canvas.height - NOTE_BOTTOM);
        ctx.stroke();
        t += beatDur;
        idx++;
    }
}

function drawKicks() {
    const ks = getKicks();
    if (ks.length === 0) return;
    ks.forEach(k => {
        if (k > duration) return;
        const x = k * PPS;
        ctx.strokeStyle = 'rgba(255, 100, 100, 0.3)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, NOTE_TOP);
        ctx.lineTo(x, canvas.height - NOTE_BOTTOM);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255, 100, 100, 0.6)';
        ctx.beginPath();
        ctx.moveTo(x - 3, NOTE_TOP - 2);
        ctx.lineTo(x + 3, NOTE_TOP - 2);
        ctx.lineTo(x, NOTE_TOP + 4);
        ctx.closePath();
        ctx.fill();
    });
}

function drawGaps() {
    gaps.forEach(gap => {
        const x1 = gap.start * PPS;
        const x2 = gap.end * PPS;
        const isSel = (selectedGap && selectedGap.id === gap.id);
        const isTarget = (dropTargetGapId === gap.id);

        if (isTarget) ctx.fillStyle = 'rgba(122, 208, 122, 0.10)';
        else if (isSel) ctx.fillStyle = 'rgba(155, 89, 182, 0.10)';
        else ctx.fillStyle = 'rgba(155, 89, 182, 0.04)';
        ctx.fillRect(x1, NOTE_TOP, x2 - x1, canvas.height - NOTE_TOP - NOTE_BOTTOM);

        const lineColor = isTarget ? '#7ad07a' : (isSel ? '#c060ff' : '#9b59b6');
        ctx.strokeStyle = lineColor;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(x1 + 1.5, NOTE_TOP);
        ctx.lineTo(x1 + 1.5, canvas.height - NOTE_BOTTOM);
        ctx.moveTo(x2 - 1.5, NOTE_TOP);
        ctx.lineTo(x2 - 1.5, canvas.height - NOTE_BOTTOM);
        ctx.stroke();

        ctx.strokeStyle = lineColor;
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(x1, NOTE_TOP + 1);
        ctx.lineTo(x2, NOTE_TOP + 1);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = lineColor;
        ctx.font = 'bold 11px Arial';
        ctx.fillText(gap.name, x1 + 6, NOTE_TOP + 14);
        ctx.font = '10px Arial';
        ctx.fillStyle = '#aaa';
        ctx.fillText((gap.end - gap.start).toFixed(2) + 's', x1 + 6, NOTE_TOP + 28);
    });
}

function drawPendingGap() {
    if (!gapMode || pendingGapStart === null) return;
    const x = pendingGapStart * PPS;
    ctx.strokeStyle = '#ffaa00';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x, NOTE_TOP);
    ctx.lineTo(x, canvas.height - NOTE_BOTTOM);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255, 170, 0, 0.4)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(x, NOTE_TOP + 1);
    ctx.lineTo(canvas.width, NOTE_TOP + 1);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = '#ffaa00';
    ctx.font = 'bold 11px Arial';
    ctx.fillText('начало ' + pendingGapStart.toFixed(2) + 's', x + 6, NOTE_TOP + 14);
    ctx.font = '10px Arial';
    ctx.fillStyle = '#ffcc66';
    ctx.fillText('тап в конец', x + 6, NOTE_TOP + 28);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBeatGrid();
    drawKicks();
    drawGaps();
    drawPendingGap();

    ctx.fillStyle = '#666';
    ctx.font = '11px Arial';
    for (let i = 0; i <= duration; i += 5) {
        ctx.fillText(i + 's', i * PPS + 3, 15);
    }

    notes.forEach(note => {
        const x = note.start * PPS;
        const w = Math.max(note.dur * PPS, 8);
        const y = freqToY(note.freq);
        const isSel = selectedNotes.includes(note);
        const isAccent = accentHz > 0 && Math.abs(note.freq - accentHz) < 0.5;
        const isMain = mainHz > 0 && Math.abs(note.freq - mainHz) < 0.5;
        let fill, outline;
        if (isSel) { fill = '#3a8eef'; outline = '#fff'; }
        else if (isAccent) { fill = '#ffaa00'; outline = '#803300'; }
        else if (isMain) { fill = '#7ad07a'; outline = '#2a5a2a'; }
        else { fill = '#5a9a8a'; outline = '#2a3a3a'; }
        ctx.fillStyle = fill;
        ctx.fillRect(x, y, w, NOTE_H);
        ctx.strokeStyle = outline;
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 0.5, y + 0.5, w - 1, NOTE_H - 1);
        if (w > 34) {
            ctx.fillStyle = 'rgba(0,0,0,0.85)';
            ctx.font = 'bold 10px Arial';
            ctx.fillText(note.freq.toFixed(0) + 'Hz', x + 3, y + 11);
        }
    });

    if (momentMode && pendingMomentBox.x1 !== null && pendingMomentBox.x2 !== null) {
        const x1 = Math.min(pendingMomentBox.x1, pendingMomentBox.x2) * PPS;
        const x2 = Math.max(pendingMomentBox.x1, pendingMomentBox.x2) * PPS;
        ctx.strokeStyle = '#c060ff';
        ctx.setLineDash([4, 4]);
        ctx.lineWidth = 2;
        ctx.strokeRect(x1, NOTE_TOP, x2 - x1, canvas.height - NOTE_TOP - NOTE_BOTTOM);
        ctx.setLineDash([]);
    }
    if (momentMode && pendingMomentBox.x1 !== null && pendingMomentBox.x2 === null) {
        const x = pendingMomentBox.x1 * PPS;
        ctx.strokeStyle = '#c060ff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(x, NOTE_TOP);
        ctx.lineTo(x, canvas.height - NOTE_BOTTOM);
        ctx.stroke();
    }
}

// ============ HIT TEST ============
function hitTestNote(x, y) {
    for (let i = notes.length - 1; i >= 0; i--) {
        const note = notes[i];
        const nx = note.start * PPS;
        const nw = Math.max(note.dur * PPS, 8);
        const ny = freqToY(note.freq);
        if (x >= nx - 4 && x <= nx + nw + 4 && y >= ny - 6 && y <= ny + NOTE_H + 6) return note;
    }
    return null;
}

function hitTestGapEdge(x) {
    const tol = 14;
    for (const gap of gaps) {
        if (Math.abs(x - gap.start * PPS) < tol) return { gap, edge: 'start' };
        if (Math.abs(x - gap.end * PPS) < tol) return { gap, edge: 'end' };
    }
    return null;
}

let lastTapTime = 0;
let lastTapGapId = null;
let lastTapEdge = null;

canvas.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 && e.pointerType === 'mouse') return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    handleTap(x, y);
});

function handleTap(x, y) {
    const time = x / PPS;

    if (gapMode) {
        if (pendingGapStart === null) {
            pendingGapStart = time;
            setHint(`Начало: ${time.toFixed(2)}s. Тапните в конец.`);
        } else {
            const start = Math.min(pendingGapStart, time);
            const end = Math.max(pendingGapStart, time);
            if (end - start < 0.1) {
                setHint('Слишком маленький');
                pendingGapStart = null;
                draw();
                return;
            }
            createGap(start, end);
            pendingGapStart = null;
            gapMode = false;
            document.getElementById('btn-gap').classList.remove('btn-active');
            setHint(`Создан: ${gaps[gaps.length - 1].name}`);
        }
        draw();
        return;
    }

    if (momentMode) {
        if (pendingMomentBox.x1 === null) {
            pendingMomentBox.x1 = time;
            setHint(`Начало: ${time.toFixed(2)}s. Тапните в конец.`);
            draw();
            return;
        }
        pendingMomentBox.x2 = time;
        const x1 = Math.min(pendingMomentBox.x1, pendingMomentBox.x2);
        const x2 = Math.max(pendingMomentBox.x1, pendingMomentBox.x2);
        selectedNotes = notes.filter(n =>
            n.start >= x1 - 0.01 && n.start + n.dur <= x2 + 0.01
        );
        pendingMomentBox = { x1: null, x2: null };
        momentMode = false;
        document.getElementById('btn-moment').classList.remove('btn-active');
        setHint(selectedNotes.length === 0
            ? 'Нет нот в диапазоне'
            : `Выделено ${selectedNotes.length} нот`);
        draw();
        return;
    }

    const edgeHit = hitTestGapEdge(x);
    if (edgeHit) {
        const now = Date.now();
        const isDouble = (now - lastTapTime < 400)
            && lastTapGapId === edgeHit.gap.id
            && lastTapEdge === edgeHit.edge;
        if (isDouble) {
            deleteGap(edgeHit.gap.id);
            lastTapTime = 0;
            lastTapGapId = null;
            lastTapEdge = null;
            draw();
            return;
        }
        selectedGap = edgeHit.gap;
        selectedEdge = edgeHit.edge;
        lastTapTime = now;
        lastTapGapId = edgeHit.gap.id;
        lastTapEdge = edgeHit.edge;
        setHint(`${edgeHit.gap.name}: ${edgeHit.edge === 'start' ? 'начало' : 'конец'}`);
        draw();
        return;
    }

    const clickedNote = hitTestNote(x, y);
    if (clickedNote) {
        selectedNotes = [clickedNote];
        playTapSound(clickedNote.freq);
        selectedGap = null;
        draw();
    } else {
        // ПЕРЕМОТКА
        seekTo(time);
        selectedNotes = [];
        selectedGap = null;
        draw();
    }
}

function setHint(text) {
    document.getElementById('hint').innerText = text;
}

function startGapSelection() {
    gapMode = true;
    pendingGapStart = null;
    document.getElementById('btn-gap').classList.add('btn-active');
    setHint('Тапни НАЧАЛО промежутка');
    draw();
}

function createGap(start, end) {
    const id = 'gap_' + Date.now();
    const name = 'Промежуток ' + (gaps.length + 1);
    gaps.push({ id, name, start, end });
    selectedGap = gaps[gaps.length - 1];
    selectedEdge = null;
}

function deleteGap(gapId) {
    gaps = gaps.filter(g => g.id !== gapId);
    gaps.forEach((g, i) => { g.name = 'Промежуток ' + (i + 1); });
    if (selectedGap && selectedGap.id === gapId) selectedGap = null;
    setHint('Промежуток удалён');
}

function deleteSelectedGap() {
    if (!selectedGap) {
        setHint('Тапни на границу промежутка');
        return;
    }
    const name = selectedGap.name;
    deleteGap(selectedGap.id);
    setHint(`Удалён: ${name}`);
    draw();
}

function moveEdge(dir) {
    if (!selectedGap || !selectedEdge) {
        setHint('Тапни на конкретную границу');
        return;
    }
    const step = 0.01 * dir;
    if (selectedEdge === 'start') {
        selectedGap.start = Math.max(0, Math.min(selectedGap.start + step, selectedGap.end - 0.05));
    } else {
        selectedGap.end = Math.min(duration, Math.max(selectedGap.end + step, selectedGap.start + 0.05));
    }
    draw();
}

function autoFillSelectedGap() {
    if (!selectedGap) {
        setHint('Тапни на границу промежутка');
        return;
    }
    const gap = selectedGap;
    notes = notes.filter(n => !(n.start >= gap.start - 0.01 && n.start < gap.end + 0.01));

    const allKicks = getKicks();
    const gapKicks = allKicks.filter(k => k >= gap.start && k <= gap.end);
    if (gapKicks.length === 0) {
        setHint(`Нет бочек в ${gap.name}`);
        draw();
        return;
    }

    const ACCENT_DUR = 0.12;
    const MIN_GAP = 0.05;
    const ACCENT_HZ = accentHz > 0 ? accentHz : mainHz;
    const MAIN_HZ = mainHz > 0 ? mainHz : accentHz;

    for (let i = 0; i < gapKicks.length; i++) {
        const k = gapKicks[i];
        const nextK = (i + 1 < gapKicks.length) ? gapKicks[i + 1] : gap.end;
        const interval = nextK - k;
        const accentDur = Math.min(ACCENT_DUR, interval - MIN_GAP);
        if (accentDur >= 0.05) {
            notes.push({ start: k, dur: accentDur, freq: ACCENT_HZ });
        }
        const mainStart = k + accentDur + MIN_GAP;
        const mainEnd = nextK - MIN_GAP;
        const mainDur = mainEnd - mainStart;
        if (mainDur >= 0.05) {
            notes.push({ start: mainStart, dur: mainDur, freq: MAIN_HZ });
        }
    }

    notes.sort((a, b) => a.start - b.start);
    setHint(`Заполнено ${gapKicks.length} бочек`);
    afterEdit();
}

function autoDetectAndFillEmpty() {
    const allKicks = getKicks();
    if (allKicks.length < 4 || notes.length === 0) {
        setHint('Мало данных для анализа');
        return;
    }

    const COVER_TOL = 0.02;
    const covered = allKicks.map(k =>
        notes.some(n => n.start <= k - COVER_TOL && k <= n.start + n.dur - COVER_TOL)
    );

    const runs = [];
    let runStart = -1;
    for (let i = 0; i <= allKicks.length; i++) {
        const uncovered = i < allKicks.length && !covered[i];
        if (uncovered) {
            if (runStart === -1) runStart = i;
        } else {
            if (runStart !== -1) {
                const count = i - runStart;
                if (count >= 2) runs.push({ startIdx: runStart, endIdx: i - 1, count });
                runStart = -1;
            }
        }
    }

    if (runs.length === 0) {
        setHint('Пустот не найдено');
        return;
    }

    const MATCH_TOL = 0.08;
    let filled = 0, skipped = 0;

    for (const run of runs) {
        const runKicks = allKicks.slice(run.startIdx, run.endIdx + 1);
        const emptyStart = runKicks[0];
        const emptyEnd = (run.endIdx + 1 < allKicks.length) ? allKicks[run.endIdx + 1] : duration;
        const emptyIntervals = [];
        for (let i = 1; i < runKicks.length; i++) {
            emptyIntervals.push(runKicks[i] - runKicks[i - 1]);
        }

        let bestDonor = null, bestScore = -1;
        for (let startIdx = 0; startIdx + run.count <= allKicks.length; startIdx++) {
            if (!(startIdx + run.count - 1 < run.startIdx || startIdx > run.endIdx)) continue;
            let score = 0, match = true;
            for (let i = 0; i < emptyIntervals.length; i++) {
                const dInt = allKicks[startIdx + i + 1] - allKicks[startIdx + i];
                const diff = Math.abs(dInt - emptyIntervals[i]);
                if (diff < MATCH_TOL) score += 1 - diff / MATCH_TOL;
                else { match = false; break; }
            }
            if (!match) continue;
            const dStart = allKicks[startIdx];
            const dEnd = (startIdx + run.count < allKicks.length) ? allKicks[startIdx + run.count] : duration;
            const donorNotes = notes.filter(n => n.start >= dStart - 0.05 && n.start < dEnd + 0.05);
            if (donorNotes.length === 0) continue;
            if (score > bestScore) {
                bestScore = score;
                bestDonor = { start: dStart, end: dEnd, notes: donorNotes };
            }
        }

        if (!bestDonor) { skipped++; continue; }

        const offset = emptyStart - bestDonor.start;
        notes = notes.filter(n => !(n.start >= emptyStart - 0.05 && n.start < emptyEnd - 0.01));
        for (const dn of bestDonor.notes) {
            const newStart = dn.start + offset;
            const newEnd = Math.min(newStart + dn.dur, emptyEnd - 0.01);
            const finalDur = newEnd - newStart;
            if (finalDur >= 0.03) {
                notes.push({ start: newStart, dur: finalDur, freq: dn.freq });
            }
        }
        filled++;
    }

    notes.sort((a, b) => a.start - b.start);
    setHint(`Пустот: ${runs.length} · заполнено: ${filled} · пропущено: ${skipped}`);
    afterEdit();
}

function splitLongNotesByKicks() {
    const allKicks = getKicks();
    if (allKicks.length === 0) return;

    const MIN_GAP = 0.04;
    const MAX_NOTE_DUR = 0.4;
    let splitCount = 0;
    const result = [];

    for (const note of notes) {
        if (note.dur <= MAX_NOTE_DUR) { result.push(note); continue; }
        const kicksInside = allKicks.filter(k =>
            k > note.start + MIN_GAP + 0.02 && k < note.start + note.dur - MIN_GAP - 0.02);
        if (kicksInside.length === 0) { result.push(note); continue; }

        const noteEnd = note.start + note.dur;
        let cursor = note.start, parts = 0;
        for (const k of kicksInside) {
            const partEnd = k - MIN_GAP;
            const partDur = partEnd - cursor;
            if (partDur >= 0.03) {
                result.push({ start: cursor, dur: partDur, freq: note.freq });
                parts++;
            }
            cursor = k;
        }
        const lastDur = noteEnd - cursor;
        if (lastDur >= 0.03) {
            result.push({ start: cursor, dur: lastDur, freq: note.freq });
            parts++;
        }
        if (parts > 1) splitCount++;
    }

    notes = result;
    notes.sort((a, b) => a.start - b.start);
    setHint(`Разрезано ${splitCount} длинных нот`);
    afterEdit();
}

function cancelMode() {
    gapMode = false;
    momentMode = false;
    pendingGapStart = null;
    pendingMomentBox = { x1: null, x2: null };
    document.getElementById('btn-gap').classList.remove('btn-active');
    document.getElementById('btn-moment').classList.remove('btn-active');
    setHint('Отменено');
    draw();
}

function saveAsMoment() {
    if (selectedNotes.length === 0) {
        momentMode = true;
        pendingMomentBox = { x1: null, x2: null };
        document.getElementById('btn-moment').classList.add('btn-active');
        setHint('Тапни начало');
        draw();
        return;
    }
    if (moments.length >= 4) { setHint('Максимум 4'); return; }
    const sorted = [...selectedNotes].sort((a, b) => a.start - b.start);
    const baseStart = sorted[0].start;
    const momentNotes = sorted.map(n => ({ start: n.start - baseStart, dur: n.dur, freq: n.freq }));
    const id = 'mom_' + Date.now();
    const name = 'Момент ' + (moments.length + 1);
    moments.push({ id, name, notes: momentNotes });
    renderMomentsPanel();
    setHint(`Сохранён ${name}`);
    selectedNotes = [];
    draw();
}

function renderMomentsPanel() {
    const panel = document.getElementById('moments-panel');
    if (moments.length === 0) {
        panel.innerHTML = '<div style="color:#555;font-size:11px;padding:0 10px;">Моменты появятся здесь</div>';
        return;
    }
    panel.innerHTML = moments.map(m => `
        <div class="moment-chip-wrap">
            <div class="moment-chip" data-moment-id="${m.id}">
                <span>${m.name}</span>
                <span class="sub">${m.notes.length} нот</span>
            </div>
            <div class="moment-del" data-del-moment="${m.id}">×</div>
        </div>
    `).join('');

    panel.querySelectorAll('[data-del-moment]').forEach(el => {
        el.addEventListener('click', (e) => {
            e.stopPropagation();
            deleteMoment(el.dataset.delMoment);
        });
    });

    panel.querySelectorAll('.moment-chip').forEach(chip => {
        chip.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            const id = chip.dataset.momentId;
            draggedMoment = moments.find(m => m.id === id);
            chip.setPointerCapture(e.pointerId);
            setHint(`Тащите "${draggedMoment.name}"`);
        });
        chip.addEventListener('pointermove', (e) => {
            if (!draggedMoment) return;
            const rect = canvas.getBoundingClientRect();
            const inCanvas = e.clientY > rect.top && e.clientY < rect.top + canvas.height;
            if (inCanvas) {
                const x = e.clientX - rect.left;
                const t = x / PPS;
                const target = gaps.find(g => t >= g.start && t <= g.end);
                dropTargetGapId = target ? target.id : null;
                draw();
            } else if (dropTargetGapId) {
                dropTargetGapId = null;
                draw();
            }
        });
        chip.addEventListener('pointerup', (e) => {
            if (!draggedMoment) return;
            const rect = canvas.getBoundingClientRect();
            if (e.clientY > rect.top && e.clientY < rect.top + canvas.height) {
                const x = e.clientX - rect.left;
                const t = x / PPS;
                const target = gaps.find(g => t >= g.start && t <= g.end);
                if (target) insertMomentIntoGap(draggedMoment, target);
            }
            draggedMoment = null;
            dropTargetGapId = null;
            draw();
        });
        chip.addEventListener('pointercancel', () => {
            draggedMoment = null;
            dropTargetGapId = null;
            draw();
        });
    });
}

function deleteMoment(momentId) {
    moments = moments.filter(m => m.id !== momentId);
    moments.forEach((m, i) => { m.name = 'Момент ' + (i + 1); });
    renderMomentsPanel();
}

function insertMomentIntoGap(moment, gap) {
    notes = notes.filter(n => !(n.start >= gap.start - 0.01 && n.start < gap.end + 0.01));
    moment.notes.forEach(mn => {
        const newStart = gap.start + mn.start;
        const newEnd = Math.min(newStart + mn.dur, gap.end);
        if (newEnd - newStart >= 0.03) {
            notes.push({ start: newStart, dur: newEnd - newStart, freq: mn.freq });
        }
    });
    notes.sort((a, b) => a.start - b.start);
    setHint(`${moment.name} → ${gap.name}`);
    afterEdit();
}

function splitNote() {
    if (selectedNotes.length !== 1) return setHint('Выбери одну');
    const note = selectedNotes[0];
    const idx = notes.indexOf(note);
    if (idx === -1) return;
    const halfDur = note.dur / 2;
    if (halfDur < 0.05) return setHint('Слишком короткая');
    notes.splice(idx + 1, 0, { start: note.start + halfDur, freq: note.freq, dur: halfDur });
    note.dur = halfDur;
    selectedNotes = [];
    playTapSound(note.freq);
    afterEdit();
}

function joinNotes() {
    if (selectedNotes.length < 2) return setHint('Выбери 2+');
    const sorted = [...selectedNotes].sort((a, b) => a.start - b.start);
    const start = sorted[0].start;
    const end = sorted[sorted.length - 1].start + sorted[sorted.length - 1].dur;
    const freq = sorted[0].freq;
    notes = notes.filter(n => !selectedNotes.includes(n));
    notes.push({ start, freq, dur: end - start });
    notes.sort((a, b) => a.start - b.start);
    selectedNotes = [];
    playTapSound(freq);
    afterEdit();
}

// ============ PLAYBACK ============
function togglePlay() {
    initAudio();
    if (wavesurfer.isPlaying()) {
        wavesurfer.pause();
    } else {
        wavesurfer.play();
    }
}

wavesurfer.on('play', () => {
    document.getElementById('play-btn').innerText = '⏸';
    if (currentMode === 'live') {
        startLiveSynth(wavesurfer.getCurrentTime());
    }
});

wavesurfer.on('pause', () => {
    document.getElementById('play-btn').innerText = '▶';
    playhead.style.display = 'none';
    stopLiveSynth();
});

wavesurfer.on('finish', () => {
    document.getElementById('play-btn').innerText = '▶';
    playhead.style.display = 'none';
    stopLiveSynth();
});

wavesurfer.on('audioprocess', () => {
    const time = wavesurfer.getCurrentTime();
    document.getElementById('timer').innerText = formatTime(time) + ' / ' + formatTime(duration);
    const x = time * PPS;
    playhead.style.left = x + 'px';
    playhead.style.display = 'block';
    const w = container.clientWidth;
    if (x > w / 2) container.scrollLeft = x - w / 2;
});

wavesurfer.on('seek', () => {
    const time = wavesurfer.getCurrentTime();
    playhead.style.left = (time * PPS) + 'px';
    if (currentMode === 'live' && wavesurfer.isPlaying()) {
        stopLiveSynth();
        startLiveSynth(time);
    }
});

function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
}

document.getElementById('vol-inst').addEventListener('input', (e) => {
    const val = e.target.value;
    document.getElementById('val-inst').innerText = val + '%';
    wavesurfer.setVolume(val / 100);
});

async function save() {
    try {
        await fetch(`${SUPABASE_URL}/rest/v1/temp_notes?id=eq.${jobId}`, {
            method: 'PATCH',
            headers: {
                'apikey': SUPABASE_KEY,
                'Authorization': `Bearer ${SUPABASE_KEY}`,
                'Content-Type': 'application/json',
                'Prefer': 'return=minimal'
            },
            body: JSON.stringify({ notes })
        });
    } catch(e) { console.error(e); }
    tg.sendData(JSON.stringify({
        job_id: jobId,
        job_dir: jobDir,
        vol_inst: document.getElementById('vol-inst').value,
        vol_bass: 9.0,
    }));
    tg.close();
}

renderMomentsPanel();
setTimeout(draw, 200);
setTimeout(draw, 800);
</script>
