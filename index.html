<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/wavesurfer.js@7"></script>
    <style>
        * { box-sizing: border-box; touch-action: none; }
        body { margin: 0; background: #141414; color: white; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .header { display: flex; justify-content: space-between; padding: 10px; background: #1a1a1a; align-items: center; }
        .time { color: #4a9eff; font-weight: bold; font-size: 14px; }
        .editor-container { flex-grow: 1; position: relative; overflow-x: auto; overflow-y: hidden; background: #0d0d0d; }
        #waveform { position: absolute; top: 50px; left: 0; height: 150px; }
        #notes-canvas { position: absolute; top: 0; left: 0; height: 100%; z-index: 10; }
        #playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: #ff4444; z-index: 15; display: none; pointer-events: none; box-shadow: 0 0 5px #ff4444; }
        .controls { background: #1a1a1a; padding: 10px; display: flex; flex-direction: column; gap: 5px; z-index: 20; }
        .slider-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #aaa; }
        .slider-row input { width: 50%; accent-color: #3a8eef; }
        .val { width: 50px; text-align: right; color: #fff; font-weight: bold; }
        .actions { display: flex; gap: 5px; padding: 10px; background: #141414; z-index: 20; flex-wrap: wrap; }
        .btn { flex: 1; min-width: 70px; padding: 12px 5px; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; color: white; }
        .btn-green { background: #7ad07a; color: black; }
        .btn-gray { background: #333; }
        .btn-blue { background: #3a8eef; }
        .btn-orange { background: #ffaa00; color: black; }
        .btn-purple { background: #9b59b6; color: white; }
    </style>
</head>
<body>
    <div class="header">
        <span>🎛 Low Bass Editor</span>
        <span class="time" id="timer">0:00 / 0:00</span>
    </div>
    <div class="editor-container" id="editor-container">
        <div id="waveform"></div>
        <canvas id="notes-canvas"></canvas>
        <div id="playhead"></div>
    </div>
    <div class="controls">
        <div class="slider-row">
            <span>Инструментал</span>
            <input type="range" id="vol-inst" min="0" max="200" value="100">
            <span class="val" id="val-inst">100%</span>
        </div>
        <div class="slider-row">
            <span>Бас</span>
            <input type="range" id="vol-bass" min="-10" max="10" value="0">
            <span class="val" id="val-bass">0 dB</span>
        </div>
    </div>
    <div class="actions">
        <button class="btn btn-gray" onclick="tg.close()">Отмена</button>
        <button class="btn btn-blue" onclick="togglePlay()" id="play-btn">▶ Play</button>
        <button class="btn btn-purple" onclick="applyChanges(event)">✓ Применить</button>
        <button class="btn btn-green" onclick="save()">✓ Готово</button>
    </div>
    <div class="actions">
        <button class="btn btn-gray" onclick="splitNote()">✂ Разделить</button>
        <button class="btn btn-gray" onclick="joinNotes()">🔗 Объединить</button>
        <button class="btn btn-orange" onclick="changeFreq(-1)">- Частота</button>
        <button class="btn btn-orange" onclick="changeFreq(1)">+ Частота</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const SUPABASE_URL = "https://nizngtkkmqqyhuyqhold.supabase.co";
        const SUPABASE_KEY = "sb_publishable_ryrnxleq02WsQ7fcqPL3uw_dJqTXdos";

        const urlParams = new URLSearchParams(window.location.search);
        const audioUrl = urlParams.get('audio');
        const instUrl = urlParams.get('inst');
        const duration = parseFloat(urlParams.get('duration') || "30");
        const jobId = urlParams.get('job_id');
        const jobDir = urlParams.get('job_dir');
        const mainHz = parseFloat(urlParams.get('main_hz') || "0");
        const accentHz = parseFloat(urlParams.get('accent_hz') || "0");

        let notes = [];
        let selectedNotes = [];
        let dragStartPositions = {};
        let isSynthMode = false;

        let audioCtx = null;
        let bassBus = null;
        let masterGain = null;
        let scheduledNodes = [];

        function makeSoftClipCurve(amount) {
            const n = 4096;
            const curve = new Float32Array(n);
            for (let i = 0; i < n; i++) {
                const x = (i * 2 / (n - 1)) - 1;
                curve[i] = Math.tanh(x * amount);
            }
            return curve;
        }

        function initAudio() {
            if (!instUrl) return;
            isSynthMode = true;
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                bassBus = audioCtx.createGain();
                bassBus.gain.value = 1.0;

                const hp = audioCtx.createBiquadFilter();
                hp.type = 'highpass';
                hp.frequency.value = 20;
                hp.Q.value = 0.7;

                masterGain = audioCtx.createGain();
                // +6 dB — как в Python-рендере
                masterGain.gain.value = Math.pow(10, 6.0 / 20);

                const limiter = audioCtx.createWaveShaper();
                // tanh(2x) — мягкий лимитер
                limiter.curve = makeSoftClipCurve(2.0);
                limiter.oversample = '4x';

                bassBus.connect(hp);
                hp.connect(masterGain);
                masterGain.connect(limiter);
                limiter.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        initAudio();

        // [FIX] Огибающая: attack 5мс, тело 1.0, release 30мс
        function applyEnvelope(gainNode, when, dur) {
            const attack = 0.005;
            const release = 0.03;
            gainNode.gain.setValueAtTime(0, when);
            gainNode.gain.linearRampToValueAtTime(1, when + attack);
            gainNode.gain.setValueAtTime(1, when + dur - release);
            gainNode.gain.linearRampToValueAtTime(0, when + dur);
        }

        // [FIX] Kick в редакторе убран — он уже в inst.mp3

        function scheduleBass(fromTime) {
            if (!isSynthMode || !audioCtx) return;
            scheduledNodes.forEach(n => { try { n.stop(); } catch(e){} });
            scheduledNodes = [];

            const audioStartTime = audioCtx.currentTime + 0.02;

            notes.forEach(note => {
                if (note.start + note.dur < fromTime) return;
                const actualStart = Math.max(note.start, fromTime);
                const offset = actualStart - note.start;
                const dur = note.dur - offset;
                if (dur < 0.05) return;
                const when = audioStartTime + (actualStart - fromTime);

                const osc = audioCtx.createOscillator();
                const env = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = note.freq;
                applyEnvelope(env, when, dur);
                osc.connect(env);
                env.connect(bassBus);
                osc.start(when);
                osc.stop(when + dur);
                scheduledNodes.push(osc);
            });
        }

        function stopBass() {
            scheduledNodes.forEach(n => { try { n.stop(); } catch(e){} });
            scheduledNodes = [];
        }

        function playNoteSound(freq) {
            initAudio();
            if (!isSynthMode || !audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let pf = freq * 4;
            if (pf < 60) pf = 60;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = pf;
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        if (jobId) {
            fetch(`${SUPABASE_URL}/rest/v1/temp_notes?id=eq.${jobId}&select=notes`, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            })
            .then(res => res.json())
            .then(data => {
                if (data && data[0]) {
                    notes = data[0].notes;
                    draw();
                }
            });
        }

        const PPS = 100;
        const canvas = document.getElementById('notes-canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('editor-container');
        const playhead = document.getElementById('playhead');

        const wavesurfer = WaveSurfer.create({
            container: '#waveform',
            waveColor: '#3a8eef', progressColor: 'transparent',
            height: 150, barWidth: 2, barGap: 1, minPxPerSec: PPS
        });

        if (instUrl) wavesurfer.load(instUrl);
        else if (audioUrl) wavesurfer.load(audioUrl);

        canvas.width = duration * PPS;
        canvas.height = container.clientHeight;
        document.getElementById('waveform').style.width = (duration * PPS) + 'px';

        let isDragging = false, startX = 0;

        const NOTE_AREA_TOP = 180;
        const NOTE_AREA_BOTTOM = 20;
        const NOTE_H = 14;

        function freqToY(freq) {
            const noteAreaH = canvas.height - NOTE_AREA_TOP - NOTE_AREA_BOTTOM;
            const norm = Math.max(0, Math.min(1, (freq - 20) / 180));
            return NOTE_AREA_TOP + (1 - norm) * (noteAreaH - NOTE_H);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#333';
            for (let i = 0; i <= duration; i++) {
                const x = i * PPS;
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
                if (i % 5 === 0) {
                    ctx.fillStyle = '#666'; ctx.font = '12px Arial';
                    ctx.fillText(i + 's', x + 5, 20);
                }
            }
            notes.forEach((note, idx) => {
                const x = note.start * PPS;
                const w = Math.max(note.dur * PPS, 10);
                const y = freqToY(note.freq);
                const isSel = selectedNotes.includes(note);
                const isAccent = accentHz > 0 && Math.abs(note.freq - accentHz) < 0.5;
                const isMain = mainHz > 0 && Math.abs(note.freq - mainHz) < 0.5;
                let fill, outline;
                if (isSel) { fill = '#3a8eef'; outline = '#fff'; }
                else if (isAccent) { fill = '#ffaa00'; outline = '#803300'; }
                else if (isMain) { fill = '#7ad07a'; outline = '#2a5a2a'; }
                else { fill = '#5a9a8a'; outline = '#2a3a3a'; }
                ctx.fillStyle = fill;
                ctx.fillRect(x, y, w, NOTE_H);
                ctx.strokeStyle = outline;
                ctx.lineWidth = 1;
                ctx.strokeRect(x + 0.5, y + 0.5, w - 1, NOTE_H - 1);
                if (w > 32) {
                    ctx.fillStyle = 'rgba(0,0,0,0.85)';
                    ctx.font = 'bold 10px Arial';
                    ctx.fillText(note.freq + 'Hz', x + 3, y + 11);
                }
                ctx.fillStyle = '#aaa';
                ctx.font = '9px Arial';
                ctx.fillText((idx + 1).toString(), x + 2, y - 2);
            });
        }

        function hitTestNote(x, y) {
            for (let i = notes.length - 1; i >= 0; i--) {
                const note = notes[i];
                const nx = note.start * PPS;
                const nw = Math.max(note.dur * PPS, 10);
                const ny = freqToY(note.freq);
                if (x >= nx - 4 && x <= nx + nw + 4 && y >= ny - 6 && y <= ny + NOTE_H + 6) return note;
            }
            return null;
        }

        canvas.addEventListener('touchstart', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.touches[0].clientX - rect.left + container.scrollLeft;
            const y = e.touches[0].clientY - rect.top;
            const clickedNote = hitTestNote(x, y);
            if (clickedNote) {
                if (!selectedNotes.includes(clickedNote)) selectedNotes = [clickedNote];
                isDragging = true;
                startX = x;
                dragStartPositions = {};
                selectedNotes.forEach(n => dragStartPositions[n] = n.start);
                playNoteSound(clickedNote.freq);
            } else {
                selectedNotes = [];
            }
            draw();
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!isDragging || selectedNotes.length === 0) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.touches[0].clientX - rect.left + container.scrollLeft;
            const delta = (x - startX) / PPS;
            selectedNotes.forEach(n => { n.start = Math.max(0, dragStartPositions[n] + delta); });
            draw();
            rescheduleIfPlaying();
        });

        canvas.addEventListener('touchend', () => { isDragging = false; });

        function togglePlay() {
            initAudio();
            if (!audioCtx) { alert("Аудио контекст не инициализирован"); return; }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (wavesurfer.isPlaying()) {
                wavesurfer.pause();
                stopBass();
            } else {
                wavesurfer.play();
                scheduleBass(wavesurfer.getCurrentTime());
            }
            document.getElementById('play-btn').innerText = wavesurfer.isPlaying() ? "⏸ Pause" : "▶ Play";
        }

        function rescheduleIfPlaying() {
            if (isSynthMode && wavesurfer.isPlaying()) {
                stopBass();
                scheduleBass(wavesurfer.getCurrentTime());
            }
        }

        wavesurfer.on('audioprocess', () => {
            const time = wavesurfer.getCurrentTime();
            document.getElementById('timer').innerText = formatTime(time) + ' / ' + formatTime(duration);
            const currentX = time * PPS;
            playhead.style.left = currentX + 'px';
            playhead.style.display = 'block';
            const w = container.clientWidth;
            if (currentX > w / 2) container.scrollLeft = currentX - (w / 2);
        });

        wavesurfer.on('seek', () => {
            const time = wavesurfer.getCurrentTime();
            playhead.style.left = (time * PPS) + 'px';
            if (wavesurfer.isPlaying()) scheduleBass(time);
        });

        wavesurfer.on('pause', () => { playhead.style.display = 'none'; stopBass(); });
        wavesurfer.on('finish', () => { playhead.style.display = 'none'; stopBass(); });

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return m + ":" + (s < 10 ? "0" : "") + s;
        }

        function splitNote() {
            if (selectedNotes.length !== 1) return alert("Выберите одну ноту");
            const note = selectedNotes[0];
            const idx = notes.indexOf(note);
            if (idx === -1) return;
            const halfDur = note.dur / 2;
            if (halfDur < 0.05) return alert("Слишком короткая");
            const newNote = {start: note.start + halfDur, freq: note.freq, dur: halfDur};
            note.dur = halfDur;
            notes.splice(idx + 1, 0, newNote);
            selectedNotes = [];
            draw();
            playNoteSound(note.freq);
            rescheduleIfPlaying();
        }

        function joinNotes() {
            if (selectedNotes.length < 2) return alert("Выберите 2+");
            const sorted = [...selectedNotes].sort((a, b) => a.start - b.start);
            const start = sorted[0].start;
            const end = sorted[sorted.length - 1].start + sorted[sorted.length - 1].dur;
            const freq = sorted[0].freq;
            const newNote = {start: start, freq: freq, dur: end - start};
            notes = notes.filter(n => !selectedNotes.includes(n));
            notes.push(newNote);
            notes.sort((a, b) => a.start - b.start);
            selectedNotes = [];
            draw();
            playNoteSound(newNote.freq);
            rescheduleIfPlaying();
        }

        function changeFreq(delta) {
            if (selectedNotes.length === 0) return alert("Выберите ноту");
            selectedNotes.forEach(n => {
                n.freq = Math.max(15, n.freq + delta);
                playNoteSound(n.freq);
            });
            draw();
            rescheduleIfPlaying();
        }

        document.getElementById('vol-inst').addEventListener('input', (e) => {
            const val = e.target.value;
            document.getElementById('val-inst').innerText = val + '%';
            wavesurfer.setVolume(val / 100);
        });

        document.getElementById('vol-bass').addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            document.getElementById('val-bass').innerText = val + ' dB';
            initAudio();
            if (masterGain) {
                const finalDb = 6.0 + val;
                masterGain.gain.value = Math.pow(10, finalDb / 20);
            }
        });

        async function applyChanges(ev) {
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/temp_notes?id=eq.${jobId}`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({ notes: notes })
                });
            } catch(e) { console.error(e); }

            stopBass();
            if (wavesurfer.isPlaying()) {
                scheduleBass(wavesurfer.getCurrentTime());
            } else {
                wavesurfer.seekTo(0);
                wavesurfer.play();
                scheduleBass(0);
                document.getElementById('play-btn').innerText = "⏸ Pause";
            }

            if (ev && ev.target) {
                const btn = ev.target;
                const origText = btn.innerText;
                btn.innerText = "✓ Применено";
                btn.disabled = true;
                setTimeout(() => {
                    btn.innerText = origText;
                    btn.disabled = false;
                }, 800);
            }
        }

        async function save() {
            const sliderBass = parseFloat(document.getElementById('vol-bass').value);
            // для Python-рендера — база 6.0 dB
            let finalBassDb = 6.0 + sliderBass;
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/temp_notes?id=eq.${jobId}`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({ notes: notes })
                });
            } catch(e) { console.error(e); }
            const data = {
                job_id: jobId,
                job_dir: jobDir,
                vol_inst: document.getElementById('vol-inst').value,
                vol_bass: finalBassDb
            };
            tg.sendData(JSON.stringify(data));
            tg.close();
        }

        setTimeout(draw, 500);
    </script>
</body>
</html>
